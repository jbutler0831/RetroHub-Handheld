<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>RetroHub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <nav id="nav"></nav>
      <div id="controller-status" class="controller-status"></div>
    </aside>
    <main id="main">
      <header id="toolbar">
        <h1 id="toolbar-title"></h1>
        <div class="toolbar-actions">
          <button class="icon-button" id="couch-button" title="Couch mode (full screen, for controllers)"></button>
          <button class="icon-button" id="rescan-button" title="Look for new games"></button>
          <label class="search">
            <span class="search-icon"></span>
            <input id="search" type="search" placeholder="Search games" aria-label="Search games" spellcheck="false">
          </label>
        </div>
      </header>
      <section id="content" tabindex="0"></section>
    </main>
  </div>

  <div id="couch" hidden></div>
  <!-- Read out by screen readers: the game picked with the keyboard or controller. -->
  <div id="announcer" class="visually-hidden" aria-live="polite"></div>

  <!-- From Play until the emulator's window takes over. -->
  <div id="launching" class="launching" role="status" aria-live="polite" hidden>
    <div class="launching-box">
      <strong id="launching-title"></strong>
      <span id="launching-detail"></span>
      <span class="launching-hint">Press B or Esc to hide</span>
    </div>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="alertdialog" aria-labelledby="modal-title">
      <div class="modal-icon"></div>
      <h2 id="modal-title">Couldn't start the game</h2>
      <p id="modal-message"></p>
      <button class="button primary" id="modal-ok">OK</button>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
